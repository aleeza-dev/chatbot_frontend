<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile / Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      NexaAI — AI Assistant for Coding, Learning & Everyday Questions
    </title>

    <meta
      name="description"
      content="NexaAI is an AI-powered assistant for coding, studying, debugging, learning, programming, interview practice, and everyday questions."
    />

    <meta
      name="keywords"
      content="NexaAI, AI assistant, AI chatbot, AI coding assistant, AI study assistant, coding AI, programming assistant, AI chatbot for students, AI learning assistant, free AI assistant"
    />

    <meta name="author" content="NexaAI" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://nexaai.com/"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="NexaAI — AI Assistant for Coding, Learning & More"
    />

    <meta
      property="og:description"
      content="Chat with NexaAI for coding help, studying, debugging, programming questions, interview practice, and everyday assistance."
    />

    <meta
      property="og:url"
      content="https://nexaai.com/"
    />

    <meta
      property="og:site_name"
      content="NexaAI"
    />

    <meta
      property="og:image"
      content="https://nexaai.com/og-image.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="NexaAI — AI Assistant for Coding, Learning & More"
    />

    <meta
      name="twitter:description"
      content="An AI-powered assistant for coding, learning, debugging, programming and everyday questions."
    />

    <meta
      name="twitter:image"
      content="https://nexaai.com/og-image.png"
    />

    <!-- Search Engine / App Information -->
    <meta
      name="application-name"
      content="NexaAI"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="NexaAI"
    />

    <!-- Web App -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
